<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clerify</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <!-- Auth Screen -->
    <div id="auth-screen" class="screen hidden">
      <div class="auth-content">
        <div class="logo">C</div>
        <h1>Clerify</h1>
        <p>Capture tasks from any webpage</p>
        <button id="login-btn" class="btn btn-primary">Log in to Clerify</button>
        <p class="auth-hint">No account? Sign up at <a href="#" id="signup-link">clerify.app</a></p>
      </div>
    </div>

    <!-- Main Screen -->
    <div id="main-screen" class="screen hidden">
      <div class="header">
        <div class="logo-small">C</div>
        <h2>Add Task</h2>
        <button id="logout-btn" class="btn-icon" title="Log out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>

      <form id="task-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" required placeholder="Task title">
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3" placeholder="Task description (optional)"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="deadline">Due Date</label>
            <input type="date" id="deadline" name="deadline">
          </div>

          <div class="form-group">
            <label for="estimated-hours">Est. Hours</label>
            <input type="number" id="estimated-hours" name="estimatedHours" min="0.5" step="0.5" placeholder="1">
          </div>
        </div>

        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" name="type">
            <option value="Other">Other</option>
            <option value="Essay">Essay</option>
            <option value="Coding">Coding</option>
            <option value="Math">Math</option>
            <option value="Research">Research</option>
          </select>
        </div>

        <div class="form-group source-info">
          <label>Source</label>
          <div id="source-url" class="source-url"></div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-full">
          <span id="submit-text">Add Task</span>
          <span id="submit-loading" class="hidden">Adding...</span>
        </button>
      </form>

      <div id="success-message" class="success-message hidden">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        <p>Task added!</p>
        <button id="add-another" class="btn btn-secondary">Add another</button>
      </div>

      <div id="error-message" class="error-message hidden">
        <p id="error-text"></p>
        <button id="retry-btn" class="btn btn-secondary">Retry</button>
      </div>
    </div>

    <!-- Loading Screen -->
    <div id="loading-screen" class="screen">
      <div class="spinner"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
