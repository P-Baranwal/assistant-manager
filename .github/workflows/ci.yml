name: CI Pipeline

on:
  push:
    branches: [ main, saas-base ]
  pull_request:
    branches: [ main, saas-base ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint Codebase
        run: npm run lint

      - name: Type Check Svelte Templates
        run: npm run type-check

      - name: Build Production Bundle
        run: npm run build
